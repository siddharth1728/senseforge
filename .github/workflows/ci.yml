name: SENSEFORGE Continuous Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Scientific Regression & Milestone Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Scientific Integrity & Regression Test Suite
        run: |
          python -m pytest tests -v

      - name: Execute Milestone 01 Verification
        run: |
          python scripts/milestone_01_verify.py

      - name: Execute Milestone 02 Verification
        run: |
          python scripts/milestone_02_verify.py

      - name: Execute Milestone 03 Verification
        run: |
          python scripts/milestone_03_verify.py

      - name: Execute Milestone 04 Verification
        run: |
          python scripts/milestone_04_verify.py

      - name: Execute Milestone 04.1 Scientific Integrity Verification
        run: |
          python scripts/milestone_04_1_verify.py
